# 本地开发用的依赖。Lab 6 再把 gameserver 自己和 MySQL 加进来。
#   make redis   # 等价于 docker compose -f deploy/docker-compose.yml up -d redis
services:
  redis:
    image: redis:7.4-alpine
    # 只绑 127.0.0.1:开发机上的 Redis 没有密码,不能暴露给局域网。
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 2s
      retries: 10
