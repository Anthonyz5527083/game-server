syntax = "proto3";

package game;

option go_package = "github.com/Anthonyz5527083/game-server/internal/pb;pb";

// Envelope 是每一帧(length-prefixed frame)的 body。
// 所有消息都包在 Envelope 里,用 oneof 区分类型:解一次码就能 switch 分发,
// 帧头不用再放 msg_type。取舍见 docs/DECISIONS.md D1。
message Envelope {
  // 请求方自增的序号。应答原样带回,发送方靠它把请求和应答配对。
  // 服务端主动推送的消息(广播、踢人)seq 为 0。
  uint32 seq = 1;

  // 字段号按模块分段,新消息往对应区间里加:
  //   10–19 网关(心跳)   20–29 登录   30–39 房间   40–49 同步(Lab 4)
  oneof payload {
    Ping ping = 10;
    Pong pong = 11;
    Kick kick = 12;

    LoginReq login_req = 20;
    LoginResp login_resp = 21;

    CreateRoomReq create_room_req = 30;
    JoinRoomReq join_room_req = 31;
    QuickMatchReq quick_match_req = 32;
    LeaveRoomReq leave_room_req = 33;
    RoomResp room_resp = 34;
    RoomEvent room_event = 35;
  }
}

// Code 是所有应答共用的结果码,0 表示成功。
enum Code {
  OK = 0;
  BAD_REQUEST = 1;        // 当前状态下不该发这条消息
  UNAVAILABLE = 2;        // 服务端依赖(Redis)暂时不可用,可以重试

  BAD_TOKEN = 10;         // token 格式不对或签名不对
  TOKEN_EXPIRED = 11;
  ALREADY_LOGGED_IN = 12; // 这条连接已经登录过了

  ROOM_NOT_FOUND = 20;
  ROOM_FULL = 21;
  ALREADY_IN_ROOM = 22;   // 一个玩家同一时间只能在一个房间里
  NOT_IN_ROOM = 23;
}

// Ping 兼作心跳:客户端定期发;服务端在 idle timeout 内收不到任何帧就踢人。
message Ping {
  // 客户端发送时刻(unix ms)。Pong 原样带回,客户端不用保存状态就能算 RTT。
  int64 client_time_ms = 1;
}

message Pong {
  int64 client_time_ms = 1; // 从 Ping 原样复制
  int64 server_time_ms = 2; // 服务端处理时刻(unix ms),以后可以用来估算时钟偏差
}

// Kick 是服务端断开连接前发的最后一帧,告诉客户端为什么被断。
message Kick {
  string reason = 1; // 比如 "login timeout"、"replaced"(同一账号在别处登录)
}

// LoginReq 必须是连接上的第一条业务消息。登录前只允许发 Ping 和 LoginReq。
message LoginReq {
  string token = 1;
}

message LoginResp {
  Code code = 1;
  uint64 player_id = 2; // 成功时是 token 里的玩家 ID
}

// ---------- 房间(登录之后才能发) ----------

message CreateRoomReq {}

message JoinRoomReq {
  uint32 room_id = 1;
}

// QuickMatchReq:有没满的房间就进(按房间号从小到大找),没有就新建一个。
message QuickMatchReq {}

message LeaveRoomReq {}

// RoomInfo 是一个房间在某一时刻的样子。
message RoomInfo {
  uint32 room_id = 1;
  uint32 capacity = 2;
  repeated uint64 members = 3; // 玩家 ID,按加入顺序
}

// RoomResp 是建房 / 加入 / 快速匹配 / 离开四种请求共用的应答。
message RoomResp {
  Code code = 1;
  RoomInfo room = 2; // 成功时是操作之后的房间;离开时是刚离开的那个房间
}

// RoomEvent 推送给房间里的其他人。触发事件的那个人不收,他从 RoomResp 里知道结果。
message RoomEvent {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    JOINED = 1;
    LEFT = 2;
  }
  Kind kind = 1;
  uint64 player_id = 2; // 谁进来了 / 谁走了
  RoomInfo room = 3;    // 事件发生之后的房间
}
